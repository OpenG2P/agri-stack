[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-agri-composite"
authors = [
  { name = "OpenG2P", email = "info@openg2p.org" },
]
description = "Agri Stack use-case composite: serves configured use cases by querying several registries over DCI and returning one signed response."
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
]
dependencies = [
  # The framework is installed from git in the Dockerfile (FASTAPI_COMMON_REF);
  # the partner-mgmt crypto backend it provides is on its develop line.
  "openg2p-fastapi-common",
  # The framework imports sqlalchemy.ext.asyncio; SQLAlchemy 2.1 no longer
  # pulls greenlet in by default (no database is used here).
  "greenlet",
  # --no-control-socket in the Dockerfile CMD (the control socket would need a
  # writable home directory under a read-only root filesystem).
  "gunicorn >=26",
  "httpx >=0.27",
  "pyjwt[crypto] >=2.8.0",
  "cryptography >=42.0.0",
  "orjson",
  "pyyaml >=6.0",
  "jinja2 >=3.1",
  "jsonpath-ng >=1.6",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest >=8", "pytest-asyncio >=0.23"]

[project.urls]
Homepage = "https://openg2p.org"
Documentation = "https://docs.openg2p.org/"
Repository = "https://github.com/openg2p/agri-stack"

[tool.hatch.version]
path = "src/openg2p_agri_composite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openg2p_agri_composite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
