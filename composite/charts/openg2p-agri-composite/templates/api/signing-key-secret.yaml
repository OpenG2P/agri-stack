{{- if and .Values.composite.enabled .Values.composite.signingKey.generate }}
{{- $sk := .Values.composite.signingKey -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $sk.secretName -}}
{{- $ours := and $existing (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing) .Release.Name) -}}
{{- /* A Secret created by hand (or by an older setup script) is left alone: the
       pod uses it as before. Otherwise the chart owns it: generated on first
       install, then read back on every upgrade (lookup) so the key never changes. */ -}}
{{- if or (not $existing) $ours }}
# The composite's signing key: an EC P-256 private key (PEM) generated on first
# install, and its kid. The composite turns it into a .p12 at start-up and serves
# its public key at /.well-known/jwks.json, where Partner Management reads it.
# Kept on uninstall, so a reinstall keeps the same key. To use your own key
# instead, see signingKey in values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sk.secretName }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: signing-key
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if and $ours $existing.data (index $existing.data $sk.pemKey) }}
  {{ $sk.pemKey }}: {{ index $existing.data $sk.pemKey }}
  {{ $sk.kidKey }}: {{ index $existing.data $sk.kidKey | default "" }}
  {{ $sk.algorithmKey }}: {{ index $existing.data $sk.algorithmKey | default ("auto" | b64enc) }}
  {{- else }}
  {{ $sk.pemKey }}: {{ genPrivateKey "ecdsa" | b64enc }}
  {{ $sk.kidKey }}: {{ printf "%s-%s" (tpl .Values.global.compositePartnerId $) (randAlphaNum 8 | lower) | b64enc }}
  {{ $sk.algorithmKey }}: {{ "auto" | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
