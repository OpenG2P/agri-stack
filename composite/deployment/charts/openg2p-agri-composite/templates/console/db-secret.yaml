{{- if and .Values.console.enabled .Values.console.db.createSecret }}
{{- $name := tpl .Values.console.db.secretName $ -}}
{{- $key := tpl .Values.console.db.passwordKey $ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
# Console database password: generated on first install, then read back from
# the cluster on every upgrade (lookup) so it never changes; kept on uninstall
# (the database and its user outlive the release in the shared Postgres).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: console-db
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
