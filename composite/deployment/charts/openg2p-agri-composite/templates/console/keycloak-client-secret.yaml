{{- if and .Values.console.enabled .Values.console.keycloakInit.enabled }}
{{- $name := tpl .Values.console.keycloakInit.clientSecretName $ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
# Secret of the console's confidential Keycloak client (key client_secret):
# generated once, read back on upgrades, kept on uninstall. keycloakInit sets
# it on the client; iamRegister uses it for its client-credentials token.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: console-keycloak-init
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "client_secret") }}
  client_secret: {{ index $existing.data "client_secret" }}
  {{- else }}
  client_secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
